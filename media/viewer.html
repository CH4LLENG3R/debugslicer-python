<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Secure CSP required by VS Code Webviews -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src vscode-webview-resource: https:; style-src 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
    <style>
        body { padding: 20px; font-family: var(--vscode-font-family); color: var(--vscode-foreground); }
        .dim-select { margin-right: 10px; padding: 5px; background: var(--vscode-dropdown-background); color: var(--vscode-dropdown-foreground); border: 1px solid var(--vscode-dropdown-border); }
        #slider-container { margin-top: 20px; display: none; }
        
        #canvas-container {
            overflow: hidden;
            border: 1px solid var(--vscode-panel-border);
            border-top: none;
            background: #000;
            width: 100%;
            height: 70vh; 
            touch-action: none;
        }
        
        #toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            padding: 6px 10px;
            background: var(--vscode-editor-background);
            border: 1px solid var(--vscode-panel-border);
            border-radius: 4px 4px 0px 0px;
        }
        .toolbar-btn {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            padding: 4px 10px;
            font-size: 13px;
            border-radius: 2px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .toolbar-btn:hover {
            background: var(--vscode-button-hoverBackground);
        }

        /* Monospace cursor info badge on the left */
        #cursor-info {
            font-family: var(--vscode-editor-font-family, monospace);
            font-size: 12px;
            padding: 2px 8px;
            background: var(--vscode-badge-background);
            color: var(--vscode-badge-foreground);
            border-radius: 3px;
            white-space: nowrap;
        }

        .toolbar-label {
            margin-left: auto;
            font-size: 12px;
            opacity: 0.8;
        }

        #render-canvas {
            transform-origin: 0 0;
            cursor: grab;
            /* Default interpolation: Nearest neighbor */
            image-rendering: pixelated;
        }
        #render-canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <h2 id="shape-display">Loading array...</h2>
    <div id="controls"></div>

    <div class="views">
        <div class="view">
            <div id="slider-container">
                <label id="depth-label">Depth: 0</label><br/>
                <input type="range" id="depth-slider" min="0" max="10" value="0" style="width: 300px;">
            </div>

            <!-- Toolbar Bar -->
            <div id="toolbar">
                <button id="btn-zoom-in" class="toolbar-btn" title="Zoom In">+</button>
                <button id="btn-zoom-out" class="toolbar-btn" title="Zoom Out">-</button>
                <button id="btn-reset" class="toolbar-btn" title="Reset View">↺</button>

                <!-- Cursor position & intensity readout -->
                <span id="cursor-info">Pos: -- | Val: --</span>
                
                <span class="toolbar-label">Interpolation:</span>
                <select id="interpolation-select" class="dim-select">
                    <option value="pixelated" selected>Nearest</option>
                    <option value="auto">Bilinear</option>
                </select>
            </div>

            <div id="canvas-container">
                <canvas id="render-canvas"></canvas>
            </div>
        </div>
    </div>

    <!-- Dynamic script injection via TypeScript -->
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
