<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Secure CSP required by VS Code Webviews -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src vscode-webview-resource: https:; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
    <link rel="stylesheet" href="{{styleUri}}">
    <title>DebugSlicer</title>
</head>
<body>
    <header class="header">
        <h1 id="shape-display">Loading array...</h1>
    </header>
    <div id="warning" class="notice" role="status" hidden></div>

    <!-- One column per dimension is added here: its size, its role and the index it is held at -->
    <section class="dims" aria-label="Dimensions">
        <div id="dim-table" class="dim-table"></div>
        <p id="hint" class="hint" hidden></p>
    </section>

    <div class="toolbar">
        <div id="colormap-field" class="field" hidden>
            <label for="colormap-select">Colormap</label>
            <select id="colormap-select" class="select"></select>
            <button id="colormap-edit" class="text-btn" title="Create a colormap from this one, or change a saved one">Edit...</button>
        </div>
        <label class="field">
            <span>Interpolation</span>
            <select id="interpolation-select" class="select">
                <option value="nearest" selected>Nearest</option>
                <option value="bilinear">Bilinear</option>
            </select>
        </label>
        <label id="caption-field" class="field" hidden>
            <span>Captions</span>
            <select id="caption-select" class="select">
                <option value="names" selected>Axial, Sagittal, Coronal</option>
                <option value="planes">H×W, D×H, D×W</option>
            </select>
        </label>
        <label id="crosshair-field" class="field" hidden>
            <input type="checkbox" id="crosshair-toggle" checked>
            <span>Crosshair</span>
        </label>
    </div>

    <section id="colormap-editor" class="colormap-editor" aria-label="Colormap editor" hidden>
        <div class="toolbar">
            <label class="field">
                <span>Name</span>
                <input type="text" id="colormap-name" class="input" maxlength="40">
            </label>
            <label class="field">
                <span>Type</span>
                <select id="colormap-kind" class="select">
                    <option value="continuous">Continuous</option>
                    <option value="step">Step</option>
                </select>
            </label>
        </div>
        <div id="colormap-preview" class="colormap-preview"></div>
        <div id="colormap-colors" class="colormap-colors"></div>
        <div class="toolbar">
            <button id="colormap-add" class="text-btn">Add colour</button>
            <button id="colormap-save" class="text-btn primary">Save</button>
            <button id="colormap-delete" class="text-btn">Delete</button>
            <button id="colormap-cancel" class="text-btn">Cancel</button>
        </div>
    </section>

    <!-- One view per plane is added here. Only the first is shown for 2D images -->
    <main id="views" class="views"></main>

    <footer class="status-bar mono">
        <span class="status-label">Pos</span>
        <span id="status-position">--</span>
        <span class="status-label">Val</span>
        <span id="status-value">--</span>
        <span id="status-swatch" class="swatch" title="Displayed colour" hidden><span id="swatch-color"></span></span>
        <span class="status-hint">Hold <kbd>Ctrl</kbd>: drag to pan, scroll to zoom</span>
        <button id="donate-button" class="donate-button" title="Support DebugSlicer" aria-label="Support DebugSlicer" hidden>♥</button>
    </footer>

    <aside id="donate-pane" class="donate-pane" aria-label="Support DebugSlicer" hidden>
        <p id="donate-message"></p>
        <div class="donate-actions">
            <a id="donate-link" class="text-btn primary">Donate with PayPal</a>
            <button id="donate-close" class="text-btn">Close</button>
        </div>
    </aside>

    <div id="toast" class="toast" role="status" hidden></div>

    <template id="view-template">
        <section class="view">
            <div class="view-header">
                <span class="view-caption"></span>
                <div class="view-slice">
                    <input type="range" class="view-slider" min="0" max="0" value="0" aria-label="Slice">
                    <span class="view-slice-label mono"></span>
                </div>
                <div class="btn-group">
                    <button class="icon-btn btn-zoom-in" title="Zoom in" aria-label="Zoom in">
                        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10"/></svg>
                    </button>
                    <button class="icon-btn btn-zoom-out" title="Zoom out" aria-label="Zoom out">
                        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg>
                    </button>
                    <button class="icon-btn btn-fit" title="Fit to window" aria-label="Fit to window">
                        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
                    </button>
                    <button class="icon-btn btn-screenshot" title="Copy screenshot to clipboard" aria-label="Copy screenshot to clipboard">
                        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5h3l1-2h4l1 2h3v8H2z"/><circle cx="8" cy="9" r="2.25"/></svg>
                    </button>
                </div>
            </div>
            <div class="canvas-container">
                <canvas class="view-canvas"></canvas>
                <div class="crosshair crosshair-h" hidden></div>
                <div class="crosshair crosshair-v" hidden></div>
            </div>
        </section>
    </template>

    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
